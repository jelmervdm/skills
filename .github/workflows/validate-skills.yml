name: Validate Agent Skills

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Skills Structure & Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Run Skills Validator
        run: |
          python3 scripts/validate-skills.py --skills-dir coach --check yaml
          python3 scripts/validate-skills.py --skills-dir coach --check references
          python3 scripts/validate-skills.py --skills-dir coach --check crossrefs
          python3 scripts/validate-skills.py --skills-dir sysadmin --check yaml
          python3 scripts/validate-skills.py --skills-dir sysadmin --check references
          python3 scripts/validate-skills.py --skills-dir sysadmin --check crossrefs

      - name: Lint Markdown Files
        run: |
          npx markdownlint-cli *.md .github/*.md .github/ISSUE_TEMPLATE/*.md coach/*/*.md coach/*/references/*.md sysadmin/*/*.md sysadmin/*/references/*.md

